    <text x="38" y="29" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      IoT
    </text>
  </g>

  <!-- Official Tagline -->
  <text x="102" y="86" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#94A3B8" letter-spacing="2.8">
