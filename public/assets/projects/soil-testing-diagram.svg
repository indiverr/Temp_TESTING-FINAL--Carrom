<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="soilBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#070F1E"/>
    </linearGradient>
    <linearGradient id="soilBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="soilOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E3E62" stroke-width="0.8" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#soilBg)"/>
  <rect width="800" height="500" rx="16" fill="url(#gridPattern)"/>

  <!-- Top Status Badge -->
  <g transform="translate(40, 30)">
    <rect width="260" height="34" rx="8" fill="#1E3E62" opacity="0.6"/>
    <circle cx="18" cy="17" r="5" fill="#10B981"/>
    <text x="32" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#38BDF8" letter-spacing="1">
      ANBU-IOT // SOIL-TEST-V2
    </text>
  </g>

  <!-- Live Telemetry Display Panel (Left) -->
  <g transform="translate(40, 85)">
    <rect width="320" height="375" rx="12" fill="#0E1E38" stroke="#1E3E62" stroke-width="1.5"/>
    
    <!-- Header -->
    <text x="24" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">
      Real-Time Soil Parameters
    </text>
    <text x="24" y="56" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">
      SENSING ARRAY • PROBE TELEMETRY
    </text>

    <!-- Metric 1: NPK & pH -->
    <g transform="translate(24, 75)">
      <rect width="272" height="60" rx="8" fill="#070F1E" stroke="#1E3E62" stroke-width="1"/>
      <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Soil pH Level</text>
      <text x="16" y="48" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#38BDF8">6.82 <tspan font-size="12" font-weight="400" fill="#64748B">pH (Optimal)</tspan></text>
      <circle cx="240" cy="30" r="14" fill="#0066FF" opacity="0.2"/>
      <path d="M 235 30 L 245 30 M 240 25 L 240 35" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Metric 2: Moisture Content -->
    <g transform="translate(24, 145)">
      <rect width="272" height="60" rx="8" fill="#070F1E" stroke="#1E3E62" stroke-width="1"/>
      <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Volumetric Moisture</text>
      <text x="16" y="48" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#FF6B00">38.4 <tspan font-size="12" font-weight="400" fill="#64748B">% (Active)</tspan></text>
      <!-- Progress mini-bar -->
      <rect x="180" y="26" width="76" height="8" rx="4" fill="#1E293B"/>
      <rect x="180" y="26" width="48" height="8" rx="4" fill="url(#soilOrange)"/>
    </g>

    <!-- Metric 3: Electrical Conductivity -->
    <g transform="translate(24, 215)">
      <rect width="272" height="60" rx="8" fill="#070F1E" stroke="#1E3E62" stroke-width="1"/>
      <text x="16" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Conductivity (EC)</text>
      <text x="16" y="48" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#10B981">1.45 <tspan font-size="12" font-weight="400" fill="#64748B">mS/cm</tspan></text>
    </g>

    <!-- Status Strip -->
    <g transform="translate(24, 290)">
      <rect width="272" height="60" rx="8" fill="#0A182F" stroke="#0066FF" stroke-width="1"/>
      <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Embedded MCU Protocol</text>
      <text x="16" y="46" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8">RS485 / MODBUS → UART BUS</text>
    </g>
  </g>

  <!-- Hardware Blueprint & Sensor Node Assembly (Right) -->
  <g transform="translate(385, 85)">
    <rect width="375" height="375" rx="12" fill="#0B1526" stroke="#1E3E62" stroke-width="1.5"/>

    <!-- Sensor Probe Visual -->
    <g transform="translate(187, 40)">
      <!-- Main Controller Enclosure -->
      <rect x="-85" y="0" width="170" height="110" rx="10" fill="#102038" stroke="#0066FF" stroke-width="2"/>
      <rect x="-70" y="15" width="140" height="50" rx="6" fill="#070F1E" stroke="#1E3E62" stroke-width="1"/>
      
      <!-- LCD screen text -->
      <text x="0" y="38" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="middle">SOIL MONITOR V2</text>
      <text x="0" y="54" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981" text-anchor="middle">STABLE // SAMPLING</text>

      <!-- Indicator LEDs -->
      <circle cx="-50" cy="85" r="5" fill="#10B981"/>
      <circle cx="-30" cy="85" r="5" fill="#0066FF"/>
      <circle cx="-10" cy="85" r="5" fill="#FF6B00"/>
      <text x="30" y="89" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">STATUS</text>

      <!-- Cable Harness -->
      <path d="M 0 110 L 0 160" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
      <path d="M 0 110 L 0 160" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>

      <!-- Probe Handle -->
      <rect x="-24" y="160" width="48" height="60" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
      <text x="0" y="195" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">PROBE</text>

      <!-- Stainless Steel Multi-Pin Sensing Tines -->
      <path d="M -14 220 L -14 310" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
      <path d="M 0 220 L 0 310" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
      <path d="M 14 220 L 14 310" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

      <!-- Measurement pulse wave -->
      <circle cx="0" cy="270" r="30" fill="none" stroke="#0066FF" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.6"/>
      <circle cx="0" cy="270" r="45" fill="none" stroke="#FF6B00" stroke-width="1.2" stroke-dasharray="2 6" opacity="0.4"/>
    </g>

    <!-- Architecture Callouts -->
    <g transform="translate(20, 20)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Multi-Depth Sensor Assembly</text>
      <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">FIELD-READY PORTABLE ARCHITECTURE</text>
    </g>

    <g transform="translate(20, 340)">
      <rect width="335" height="24" rx="4" fill="#070F1E"/>
      <text x="168" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38BDF8" text-anchor="middle">
        • LOW LATENCY • BATTERY POWERED • FIELD-VALIDATED
      </text>
    </g>
  </g>
</svg>
