<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sensorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="50%" stop-color="#0D1F3C"/>
      <stop offset="100%" stop-color="#070E1A"/>
    </linearGradient>
    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="nodeOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <pattern id="pcbGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E3E62" stroke-width="0.5" opacity="0.4"/>
      <circle cx="0" cy="0" r="1.5" fill="#0066FF" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#sensorBg)"/>
  <rect width="800" height="500" rx="16" fill="url(#pcbGrid)"/>

  <!-- Top Title Bar -->
  <g transform="translate(40, 30)">
    <rect width="330" height="34" rx="8" fill="#142847" stroke="#0066FF" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#38BDF8"/>
    <text x="32" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#38BDF8" letter-spacing="1">
      ANBU-IOT // MODULAR-SENSOR-STACK
    </text>
  </g>

  <!-- Left: Modular PCB & Sensor Topology Block -->
  <g transform="translate(40, 85)">
    <rect width="420" height="375" rx="12" fill="#0B1728" stroke="#1E3E62" stroke-width="1.5"/>
    
    <text x="24" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">
      Low-Cost Multi-Node Edge Architecture
    </text>
    <text x="24" y="56" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">
      HARDWARE-AGNOSTIC • EXPANDABLE I/O CHANNELS
    </text>

    <!-- Microcontroller Main Module Board -->
    <g transform="translate(24, 75)">
      <rect width="372" height="180" rx="10" fill="#08201E" stroke="#10B981" stroke-width="1.5"/>
      
      <!-- MCU Chip -->
      <rect x="136" y="45" width="100" height="90" rx="6" fill="#0A0F1D" stroke="#0066FF" stroke-width="1.5"/>
      <text x="186" y="85" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">ANBU MCU</text>
      <text x="186" y="105" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B" text-anchor="middle">32-BIT RISC / SOC</text>

      <!-- Pinout traces Left -->
      <path d="M 20 50 L 136 50" stroke="#0066FF" stroke-width="2" stroke-dasharray="3 3"/>
      <path d="M 20 90 L 136 90" stroke="#FF6B00" stroke-width="2"/>
      <path d="M 20 130 L 136 130" stroke="#10B981" stroke-width="2"/>
      
      <circle cx="20" cy="50" r="4" fill="#0066FF"/>
      <text x="32" y="44" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">I2C / SPI</text>
      
      <circle cx="20" cy="90" r="4" fill="#FF6B00"/>
      <text x="32" y="84" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">ADC (0-5V)</text>
      
      <circle cx="20" cy="130" r="4" fill="#10B981"/>
      <text x="32" y="124" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">UART BUS</text>

      <!-- Pinout traces Right -->
      <path d="M 236 60 L 350 60" stroke="#38BDF8" stroke-width="2"/>
      <path d="M 236 110 L 350 110" stroke="#FF6B00" stroke-width="2" stroke-dasharray="3 3"/>

      <circle cx="350" cy="60" r="4" fill="#38BDF8"/>
      <text x="340" y="54" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="end">RF / TX</text>

      <circle cx="350" cy="110" r="4" fill="#FF6B00"/>
      <text x="340" y="104" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="end">PWM OUT</text>
    </g>

    <!-- Bottom Feature Points -->
    <g transform="translate(24, 275)">
      <rect width="372" height="75" rx="8" fill="#070F1E" stroke="#1E3E62" stroke-width="1"/>
      <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Engineered For Field Portability</text>
      <text x="16" y="48" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8">
        • Ultra-low sleep current (&lt;15μA) • Solar/LiFePO4 charging
      </text>
      <text x="16" y="64" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8">
        • High signal-to-noise ratio • Surge & reverse polarity protected
      </text>
    </g>
  </g>

  <!-- Right: Sensor Array Nodes -->
  <g transform="translate(485, 85)">
    <rect width="275" height="375" rx="12" fill="#0D1B2E" stroke="#1E3E62" stroke-width="1.5"/>

    <text x="20" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
      Connected Sensors
    </text>
    <text x="20" y="54" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">
      PLUG-AND-PLAY INTERFACE
    </text>

    <!-- Node 1: Environmental -->
    <g transform="translate(20, 75)">
      <rect width="235" height="60" rx="8" fill="#070F1E" stroke="#1E3E62" stroke-width="1"/>
      <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Environmental Probe</text>
      <text x="14" y="46" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8">Temp • RH • Pressure</text>
    </g>

    <!-- Node 2: Soil Matrix -->
    <g transform="translate(20, 145)">
      <rect width="235" height="60" rx="8" fill="#070F1E" stroke="#1E3E62" stroke-width="1"/>
      <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Soil Multi-Depth Matrix</text>
      <text x="14" y="46" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FF6B00">pH • Moisture • Salinity</text>
    </g>

    <!-- Node 3: Optical / Gas -->
    <g transform="translate(20, 215)">
      <rect width="235" height="60" rx="8" fill="#070F1E" stroke="#1E3E62" stroke-width="1"/>
      <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Optical & Gas Sensor</text>
      <text x="14" y="46" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10B981">PAR Light • CO2 • NH3</text>
    </g>

    <!-- Node 4: Status -->
    <g transform="translate(20, 285)">
      <rect width="235" height="65" rx="8" fill="#0B2034" stroke="#0066FF" stroke-width="1"/>
      <text x="14" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Cost Optimization</text>
      <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34D399">✓ 70% LOWER DEPLOYMENT COST</text>
    </g>
  </g>
</svg>
